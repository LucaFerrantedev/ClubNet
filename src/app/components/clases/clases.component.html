<app-navbar></app-navbar>
<div class="clases-main" [class.dark-mode]="isDarkMode">
  <div class="clases-header animate-fadein">
    <h1 class="clases-title">Clases del Club</h1>
    <p class="clases-subtitle">Consulta el listado de clases disponibles.</p>
  </div>

  <div class="content-wrapper">
    <div class="table-container animate-slidein">
      <table class="clases-table">
        <thead>
          <tr>
            <th>Título</th>
            <th>Detalle</th>
          </tr>
        </thead>
        <tbody>
          @if (isLoading) {
          <tr>
            <td colspan="2" class="loading-cell">Cargando clases...</td>
          </tr>
          }
          @for (clase of clases; track clase.clase_id) {
          <tr>
            <td>{{ clase.titulo }}</td>
            <td>{{ clase.detalle }}</td>
          </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
