<div class="login-bg">
    <div class="login-card">
        <div class="club-logo">
            <img src="https://img.icons8.com/color/96/football2.png" alt="Club Logo" />
            <h2>Club Deportivo</h2>
        </div>
        <div class="tabs">
            <button [class.active]="activeTab === 'login'" (click)="activeTab = 'login'">Iniciar sesión</button>
            <button [class.active]="activeTab === 'register'" (click)="activeTab = 'register'">Registrarse</button>
        </div>
        <form *ngIf="activeTab === 'login'" (submit)="onLogin($event)">
            <div class="input-group">
                <span class="icon"><i class="fa fa-user"></i></span>
                <input type="text" placeholder="Usuario o Email" required />
            </div>
            <div class="input-group">
                <span class="icon"><i class="fa fa-lock"></i></span>
                <input type="password" placeholder="Contraseña" required />
            </div>
            <button class="btn-main" type="submit">Entrar</button>
            <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </form>
        <form *ngIf="activeTab === 'register'" (submit)="onRegister($event)">
            <div class="input-group">
                <span class="icon"><i class="fa fa-user-plus"></i></span>
                <input type="text" placeholder="Nombre completo" required />
            </div>
            <div class="input-group">
                <span class="icon"><i class="fa fa-envelope"></i></span>
                <input type="email" placeholder="Email" required />
            </div>
            <div class="input-group">
                <span class="icon"><i class="fa fa-lock"></i></span>
                <input type="password" placeholder="Contraseña" required />
            </div>
            <div class="input-group">
                <span class="icon"><i class="fa fa-lock"></i></span>
                <input type="password" placeholder="Repetir contraseña" required />
            </div>
            <button class="btn-main" type="submit">Registrarse</button>
        </form>
    </div>
</div>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
